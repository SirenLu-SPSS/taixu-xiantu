services:
  - type: web
    name: taixu-xiantu
    runtime: static
    repo: https://github.com/SirenLu-SPSS/taixu-xiantu
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm test && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
