# Supabase Free holds the account database. Existing Render database is a frozen backup.
services:
  - type: web
    name: taixu-player-accounts-trial
    runtime: node
    region: singapore
    plan: free
    repo: https://github.com/SirenLu-SPSS/taixu-xiantu
    branch: feat/hard-world-invasion
    buildCommand: npm ci --include=dev && npm test
    startCommand: node server/start.cjs
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://taixu-xiantu.onrender.com
