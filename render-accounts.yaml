# Separate account infrastructure. Apply only after approving the recurring cost.
# The existing static site and its URL remain unchanged.
databases:
  - name: taixu-player-records-trial
    region: singapore
    plan: free
    ipAllowList: []
services:
  - type: web
    name: taixu-player-accounts-trial
    runtime: node
    region: singapore
    plan: free
    repo: https://github.com/SirenLu-SPSS/taixu-xiantu
    branch: feat/hard-world-invasion
    buildCommand: npm ci --include=dev && npm test
    startCommand: node server/start.cjs
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taixu-player-records-trial
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://taixu-xiantu.onrender.com
